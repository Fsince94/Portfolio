<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <i class="fa-brands fa-apple"></i>
            <span>WEBSITE LOGO</span>
        </div>
        <ul>
            <li data-view="home">
                <a href="#">
                    <i class="fas fa-home"></i>
                    <span>HOME</span>
                </a>
            </li>
            <li class="active" data-view="profile">
                <a href="#">
                    <i class="fas fa-user"></i>
                    <span>PROFILE</span>
                </a>
            </li>
            <li data-view="inbox">
                <a href="#">
                    <i class="fas fa-inbox"></i>
                    <span>INBOX</span>
                </a>
            </li>
            <li data-view="analytics">
                <a href="#">
                    <i class="fas fa-chart-line"></i>
                    <span>ANALYTICS</span>
                </a>
            </li>
            <li data-view="order">
                <a href="#">
                    <i class="fas fa-shopping-cart"></i>
                    <span>ORDER</span>
                </a>
            </li>
            <li data-view="settings">
                <a href="#">
                    <i class="fas fa-cog"></i>
                    <span>SETTINGS</span>
                </a>
            </li>
        </ul>
        <div class="user">
            <img src="https://placehold.co/40x40" alt="user">
            <span>Joaquin Laurens</span>
        </div>
        <div class="logout">
            <a href="#">
                <i class="fas fa-sign-out-alt"></i>
                <span>LOGOUT</span>
            </a>
        </div>
    </nav>
    <main class="main-content">
        <div id="home" class="view" style="display: none;">
            <h1>Home</h1>
        </div>
        <div id="profile" class="view">
            <h1>Profile</h1>
        </div>
        <div id="inbox" class="view" style="display: none;">
            <h1>Inbox</h1>
        </div>
        <div id="analytics" class="view" style="display: none;">
            <h1>Analytics</h1>
        </div>
        <div id="order" class="view" style="display: none;">
            <h1>Order</h1>
        </div>
        <div id="settings" class="view" style="display: none;">
            <h1>Settings</h1>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
